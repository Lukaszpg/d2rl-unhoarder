name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: unhoarder-release
  cancel-in-progress: false

jobs:
  release:
    name: Version, build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump canonical version
        id: version
        shell: pwsh
        run: |
          $current = (Get-Content VERSION -Raw).Trim()
          if ($current -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "Invalid VERSION: $current" }
          $major=[int]$Matches[1]; $minor=[int]$Matches[2]; $patch=[int]$Matches[3]
          switch ('${{ inputs.bump }}') {
            'major' { $major++; $minor=0; $patch=0 }
            'minor' { $minor++; $patch=0 }
            'patch' { $patch++ }
          }
          $next="$major.$minor.$patch"; $tag="v$next"
          git fetch --tags origin
          $existingTag = git tag --list $tag
          if ($existingTag -eq $tag) { throw "Tag $tag already exists" }
          [IO.File]::WriteAllText((Join-Path $PWD "VERSION"), "$next`n", [Text.UTF8Encoding]::new($false))
          "version=$next" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run Python tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem "tests" -Filter "*_test.py" | Sort-Object Name
          foreach ($test in $tests) {
            python $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "Python test failed: $($test.Name)" }
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -DUNHOARDER_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run portable C++ tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify DLL
        shell: pwsh
        run: |
          if (-not (Test-Path "build\bin\unhoarder.dll")) { throw "unhoarder.dll was not produced" }

      - name: Commit and tag
        shell: pwsh
        run: |
          $tag='${{ steps.version.outputs.tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(release): $tag"
          git tag -a $tag -m "UnHoarder $tag"
          git push --atomic origin HEAD:main "refs/tags/$tag"

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version='${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build\bin\unhoarder.dll" "dist\unhoarder.dll"
          git archive --format=zip --prefix="unhoarder-$version/" -o "dist\unhoarder-$version-source.zip" HEAD

          if (-not (Test-Path "data" -PathType Container)) {
            throw "Required release data folder is missing: data"
          }
          Compress-Archive -Path "data" -DestinationPath "dist\unhoarder-$version-data.zip" -CompressionLevel Optimal

          $names=@("unhoarder.dll","unhoarder-$version-source.zip","unhoarder-$version-data.zip")
          $lines=foreach($name in $names){$h=(Get-FileHash (Join-Path dist $name) -Algorithm SHA256).Hash.ToLowerInvariant(); "$h  $name"}
          [IO.File]::WriteAllLines((Join-Path $PWD "dist\SHA256SUMS.txt"),$lines,[Text.UTF8Encoding]::new($false))

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version='${{ steps.version.outputs.version }}'
          $tag='${{ steps.version.outputs.tag }}'
          gh release create $tag "dist\unhoarder.dll" "dist\unhoarder-$version-source.zip" "dist\unhoarder-$version-data.zip" "dist\SHA256SUMS.txt" --verify-tag --title "UnHoarder $tag" --generate-notes

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: unhoarder-release-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
