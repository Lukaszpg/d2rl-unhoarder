name: Build UnHoarder

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source tree
        shell: pwsh
        run: |
          $required = @(
            "CMakeLists.txt",
            "src\plugin.cpp",
            "src\plugin.rc",
            "src\minimap_overlay_renderer.cpp"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required source file is missing: $path"
            }
          }

      - name: Run source contract tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem "tests" -Filter "*_source_test.py" | Sort-Object Name
          foreach ($test in $tests) {
            Write-Host "==> $($test.Name)"
            python $test.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Source contract failed: $($test.Name)"
            }
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build

      - name: Build UnHoarder
        shell: pwsh
        run: |
          cmake `
            --build build `
            --config Release `
            --target unhoarder `
            --parallel

      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = "build\bin\unhoarder.dll"
          if (-not (Test-Path $dll)) {
            throw "Expected DLL was not produced: $dll"
          }
          Get-Item $dll | Format-List FullName, Length, LastWriteTime

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: unhoarder-${{ github.sha }}
          path: build/bin/unhoarder.dll
          if-no-files-found: error
