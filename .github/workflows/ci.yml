name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Python tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem "tests" -Filter "*_test.py" | Sort-Object Name
          foreach ($test in $tests) {
            Write-Host "==> $($test.Name)"
            python $test.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Python test failed: $($test.Name)"
            }
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -DUNHOARDER_BUILD_TESTS=ON -DUNHOARDER_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run portable C++ tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify DLL
        shell: pwsh
        run: |
          if (-not (Test-Path "build\bin\unhoarder.dll")) { throw "unhoarder.dll was not produced" }

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: unhoarder-ci-${{ github.sha }}
          path: build/bin/unhoarder.dll
          if-no-files-found: error
